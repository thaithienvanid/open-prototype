<!doctype html>
<html lang="en" data-proto-format="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="platforms" content="web">
<meta name="themes" content="light">
<title>To-do: prototype</title>
<style data-proto-tokens>
:root { --space: 16px; --color-surface: #fafafb; --color-text: #1c1e21; --color-border: #858b94; color-scheme: light; }
</style>
<style>
  body { margin: 0; padding: var(--space); font: 1rem/1.5 system-ui, sans-serif; background: var(--color-surface); color: var(--color-text); }
  .tall { height: 1600px; }
  button { font: inherit; min-height: 24px; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); }
</style>
</head>
<body>
<h1 data-proto-slot="title"></h1>
<section data-proto-screen="tasks" data-proto-title="Tasks">
  <div data-proto-state="online" data-testid="tasks-online">
    <p data-proto-text="greeting"></p>
    <button type="button" data-testid="tasks-add">Add a task</button>
    <p><a href="https://example.com/terms" data-testid="tasks-terms">Terms</a> <a href="#help" data-testid="tasks-help">Help</a></p>
    <div class="tall"></div>
    <h2 id="help" data-testid="tasks-help-heading">Help</h2>
  </div>
  <div data-proto-state="empty" data-testid="tasks-empty"><p data-proto-text="nothing"></p></div>
</section>
<script type="application/json" data-proto-fixtures>
{ "product": "To-do", "greeting": "Three tasks today ✅", "nothing": "Nothing to do." }
</script>
</body>
</html>
