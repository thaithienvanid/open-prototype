<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1142" width="800" height="1142" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">open-prototype: from one sentence to a design you can build</title>
<desc id="hero-desc">A chat message from a person, shown as a round avatar, asks for “A sign-in screen, every state”. A blue curve leads down from the message to one sign-in design: a phone in the error state, and two cards in the loading and offline states, with three numbered review comments pinned on it. The tagline reads: From one sentence to a design you can build. Under it is the name open-prototype, with its mark: a screen with a comment pinned on it.</desc>
