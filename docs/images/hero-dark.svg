<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">open-prototype: from one sentence to a design you can build</title>
<desc id="hero-desc">A chat message from a person, shown as a round avatar, asks for “A sign-in screen, every state”. A blue curve leads from the message to one sign-in design on a desktop window and a phone, in four states, ready, loading, error, and offline, with three numbered review comments pinned on it. The tagline reads: From one sentence to a design you can build. Under it is the name open-prototype, with its mark: a screen with a comment pinned on it.</desc>
