<section data-proto-screen="api" data-proto-title="Developer portal" data-proto-initial="ready">
  <div data-proto-state="ready" data-testid="dev-api-ready">
    <div class="toolbar">
      <p class="muted" data-proto-text="dev.summary"></p>
      <button type="button" class="btn btn-primary" data-proto-component="button" data-proto-variant="primary" data-proto-go="developers:api/key-created" data-testid="dev-create-key">Create API key</button>
    </div>
    <h2 class="section-heading">Scoped API keys</h2>
    <ul class="table-list" data-proto-list="dev.keys">
      <template data-proto-item>
        <li class="table-row" data-proto-component="api-key-row">
          <div class="row-main">
            <strong data-proto-field="name"></strong>
            <code class="mono" data-proto-field="prefix"></code>
          </div>
          <span class="pill" data-proto-component="status-pill" data-proto-field="scope"></span>
          <span class="row-meta" data-proto-field="last_used"></span>
        </li>
      </template>
    </ul>
    <h2 class="section-heading">Failed webhook deliveries</h2>
    <ul class="table-list" data-proto-list="dev.failed_webhooks">
      <template data-proto-item>
        <li class="table-row" data-proto-component="webhook-row">
          <div class="row-main">
            <strong data-proto-field="event"></strong>
            <code class="mono" data-proto-field="endpoint"></code>
          </div>
          <span class="pill" data-proto-component="status-pill" data-proto-field="status"></span>
          <button type="button" class="btn btn-secondary" data-proto-component="button" data-proto-variant="secondary" data-proto-go="developers:api/ready" data-testid="webhook-retry">Retry</button>
        </li>
      </template>
    </ul>
    <h2 class="section-heading">Delivered webhooks</h2>
    <ul class="table-list" data-proto-list="dev.webhooks">
      <template data-proto-item>
        <li class="table-row" data-proto-component="webhook-row">
          <div class="row-main">
            <strong data-proto-field="event"></strong>
            <code class="mono" data-proto-field="endpoint"></code>
          </div>
          <span class="pill" data-proto-component="status-pill" data-proto-field="status"></span>
        </li>
      </template>
    </ul>
  </div>
  <div data-proto-state="key-created" data-testid="dev-api-created">
    <div data-proto-use="notice" data-proto-arg-tone="success" data-proto-arg-role="status" data-proto-arg-title-key="dev.created_title" data-proto-arg-body-key="dev.created_body" data-proto-arg-go="developers:api/keys-saved" data-proto-arg-testid="dev-key-done" data-proto-arg-action="I saved this key"></div>
  </div>
  <div data-proto-state="keys-saved" data-testid="dev-api-keys-saved">
    <div data-proto-use="notice" data-proto-arg-tone="success" data-proto-arg-role="status" data-proto-arg-title-key="dev.saved_title" data-proto-arg-body-key="dev.saved_body" data-proto-arg-go="developers:api/ready" data-proto-arg-testid="dev-revoke-key" data-proto-arg-action="Revoke this key"></div>
    <h2 class="section-heading">Scoped API keys</h2>
    <ul class="table-list" data-proto-list="dev.keys_saved">
      <template data-proto-item>
        <li class="table-row" data-proto-component="api-key-row">
          <div class="row-main">
            <strong data-proto-field="name"></strong>
            <code class="mono" data-proto-field="prefix"></code>
          </div>
          <span class="pill" data-proto-component="status-pill" data-proto-field="scope"></span>
          <span class="row-meta" data-proto-field="last_used"></span>
        </li>
      </template>
    </ul>
  </div>
  <div data-proto-state="empty" data-testid="dev-api-empty">
    <div data-proto-use="empty-state" data-proto-arg-title-key="dev.empty_title" data-proto-arg-body-key="dev.empty_body" data-proto-arg-go="developers:api/first-key-created" data-proto-arg-testid="dev-create-first" data-proto-arg-action="Create first API key"></div>
  </div>
  <div data-proto-state="first-key-created" data-testid="dev-api-first-created">
    <div data-proto-use="notice" data-proto-arg-tone="success" data-proto-arg-role="status" data-proto-arg-title-key="dev.created_title" data-proto-arg-body-key="dev.created_body" data-proto-arg-go="developers:api/first-key-saved" data-proto-arg-testid="dev-first-key-done" data-proto-arg-action="I saved this key"></div>
  </div>
  <div data-proto-state="first-key-saved" data-testid="dev-api-first-saved">
    <div data-proto-use="notice" data-proto-arg-tone="success" data-proto-arg-role="status" data-proto-arg-title-key="dev.saved_title" data-proto-arg-body-key="dev.saved_body" data-proto-arg-go="developers:api/empty" data-proto-arg-testid="dev-revoke-first-key" data-proto-arg-action="Revoke this key"></div>
    <h2 class="section-heading">Scoped API keys</h2>
    <ul class="table-list" data-proto-list="dev.first_key">
      <template data-proto-item>
        <li class="table-row" data-proto-component="api-key-row">
          <div class="row-main">
            <strong data-proto-field="name"></strong>
            <code class="mono" data-proto-field="prefix"></code>
          </div>
          <span class="pill" data-proto-component="status-pill" data-proto-field="scope"></span>
          <span class="row-meta" data-proto-field="last_used"></span>
        </li>
      </template>
    </ul>
  </div>
</section>
