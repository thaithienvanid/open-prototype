:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 16px;
  --space-4: 24px;
  --space-5: 32px;
  --space-6: 48px;
  --radius-sm: 6px;
  --radius-control: 8px;
  --radius-surface: 12px;
  --radius-pill: 999px;
  --size-control: 44px;
  --size-control-sm: 36px;
  --size-sidebar: 244px;
  --size-content-max: 62rem;
  --font-sans: system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-size-caption: 0.8125rem;
  --font-size-small: 0.875rem;
  --font-size-body: 0.96875rem;
  --font-size-heading: 1.1875rem;
  --font-size-title: 1.625rem;
  --duration-fast: 140ms;
  --duration-shimmer: 1400ms;
  --easing-standard: cubic-bezier(0.2, 0, 0, 1);
}
@media (prefers-reduced-motion: reduce) {
  :root {
    --duration-fast: 0ms;
    --duration-shimmer: 0ms;
  }
}
:root,
:root[data-proto-theme="light"] {
  --color-surface: #f7f8fa;
  --color-surface-raised: #ffffff;
  --color-surface-sunken: #eef1f5;
  --color-text: #181c23;
  --color-text-muted: #525b6b;
  --color-border: #dfe3ea;
  --color-border-strong: #8d99ac;
  --color-accent: #2558d4;
  --color-accent-strong: #1c45ab;
  --color-accent-subtle: #e8effd;
  --color-on-accent: #ffffff;
  --color-success: #0f6b47;
  --color-success-subtle: #e3f5ed;
  --color-warning: #8a4b00;
  --color-warning-subtle: #fef3db;
  --color-danger: #b82920;
  --color-danger-subtle: #fdeceb;
  --color-focus: #2558d4;
  color-scheme: light;
}
:root[data-proto-theme="dark"] {
  --color-surface: #101216;
  --color-surface-raised: #171a20;
  --color-surface-sunken: #20242c;
  --color-text: #e6e9ef;
  --color-text-muted: #a3adbd;
  --color-border: #282d37;
  --color-border-strong: #667085;
  --color-accent: #7ea6ff;
  --color-accent-strong: #a3c0ff;
  --color-accent-subtle: #182542;
  --color-on-accent: #0c1730;
  --color-success: #6ee7b7;
  --color-success-subtle: #122e24;
  --color-warning: #fcd34d;
  --color-warning-subtle: #2e240c;
  --color-danger: #fca5a5;
  --color-danger-subtle: #351817;
  --color-focus: #7ea6ff;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-proto-theme]) {
    --color-surface: #101216;
    --color-surface-raised: #171a20;
    --color-surface-sunken: #20242c;
    --color-text: #e6e9ef;
    --color-text-muted: #a3adbd;

    --color-border-strong: #667085;

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    font-family: var(--font-sans);
    font-size: var(--font-size-body);
    line-height: 1.55;
    font-variant-numeric: tabular-nums;
    background: var(--color-surface);
    color: var(--color-text);
    container: frame / inline-size;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  button, input, select { font: inherit; color: inherit; }
  .mono { font-family: var(--font-mono); font-size: var(--font-size-caption); color: var(--color-text-muted); }
  .muted { color: var(--color-text-muted); margin: 0; }

  /* Flat SaaS shell */
  .shell {
    display: grid;
    min-height: 100dvh;
    grid-template-columns: var(--size-sidebar) minmax(0, 1fr);
    grid-template-rows: auto 1fr;
    grid-template-areas: "side top" "side main";
  }
  .sidebar {
    grid-area: side;
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
    padding: var(--space-4) var(--space-3);
    background: var(--color-surface-raised);
    border-inline-end: 1px solid var(--color-border);
  }
  .brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
    padding-inline: var(--space-2);
  }
  .brand-mark {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    font-weight: 700;
    letter-spacing: -0.015em;
  }
  .brand-icon {
    width: 24px;
    height: 24px;
    border-radius: var(--radius-sm);
    background: var(--color-accent);
    color: var(--color-on-accent);
    display: grid;
    place-items: center;
    font-size: var(--font-size-caption);
    font-weight: 700;
  }
  .org-box {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-control);
    background: var(--color-surface);
    font-size: var(--font-size-small);
  }
  .org-box strong { font-weight: 600; }
  .org-box span { color: var(--color-text-muted); font-size: var(--font-size-caption); }

  .side-nav {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }
  .side-nav button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    min-height: var(--size-control);
    padding: var(--space-2) var(--space-3);
    border: 1px solid transparent;
    border-radius: var(--radius-control);
    background: transparent;
    color: var(--color-text-muted);
    font-weight: 500;
    text-align: start;
    cursor: pointer;
    transition: background-color var(--duration-fast) var(--easing-standard), color var(--duration-fast) var(--easing-standard);
  }
  .side-nav button:hover {
    background: var(--color-surface-sunken);
    color: var(--color-text);
  }
  .side-nav button[aria-current="page"] {
    background: var(--color-accent-subtle);
    color: var(--color-accent);
    font-weight: 600;
  }
  .nav-divider {
    margin: var(--space-2) 0;
    border: 0;
    border-top: 1px solid var(--color-border);
  }

  /* Top workspace bar */
  .topbar {
    grid-area: top;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-2) var(--space-3);
    padding: var(--space-3) var(--space-5);
    background: var(--color-surface-raised);
    border-block-end: 1px solid var(--color-border);
  }
  .topbar h1 {
    margin: 0;
    font-size: var(--font-size-title);
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    min-height: var(--size-control-sm);
    padding: var(--space-1) var(--space-2);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-control);
    background: var(--color-surface);
    color: var(--color-text);
    font-size: var(--font-size-small);
    font-weight: 500;
    cursor: pointer;
  }
  .back-btn:hover { background: var(--color-surface-sunken); }

  main {
    grid-area: main;
    width: 100%;
    max-width: var(--size-content-max);
    padding: var(--space-5);
  }
  main:focus, [data-proto-slot="title"]:focus { outline: none; }
  h2 { margin: 0; font-size: var(--font-size-heading); font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
  .section-heading { margin: var(--space-5) 0 var(--space-3); }

  /* Responsive collapse for phone / narrow frames */
  @container frame (max-width: 48rem) {
    .shell {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto auto 1fr;
      grid-template-areas: "side" "top" "main";
    }
    .sidebar {
      gap: var(--space-2);
      padding: var(--space-3);
      border-inline-end: 0;
      border-block-end: 1px solid var(--color-border);
    }
    .org-box, .nav-divider { display: none; }
    .side-nav {
      flex-direction: row;
      flex-wrap: wrap;
      gap: var(--space-1);
    }
    .side-nav button {
      width: auto;
      min-height: var(--size-control);
      padding: var(--space-1) var(--space-3);
      font-size: var(--font-size-small);
    }
    .topbar { padding: var(--space-3); }
    main { padding: var(--space-3); }
  }

  /* Controls */
  .actions { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    min-height: var(--size-control);
    padding: 0 var(--space-3);
    border-radius: var(--radius-control);
    font-weight: 600;
    font-size: var(--font-size-small);
    cursor: pointer;
    transition: background-color var(--duration-fast) var(--easing-standard), border-color var(--duration-fast) var(--easing-standard);
  }
  .btn-sm { min-height: var(--size-control); padding: 0 var(--space-3); }
  .btn-full { width: 100%; }
  .btn-primary { border: 1px solid var(--color-accent); background: var(--color-accent); color: var(--color-on-accent); }
  .btn-primary:hover { background: var(--color-accent-strong); border-color: var(--color-accent-strong); }
  .btn-secondary { border: 1px solid var(--color-border-strong); background: var(--color-surface-raised); color: var(--color-text); }
  .btn-secondary:hover { background: var(--color-surface-sunken); }
  .btn-danger { border: 1px solid var(--color-danger); background: var(--color-danger); color: var(--color-on-accent); }

  /* Forms */
  .field-group { display: grid; gap: var(--space-3); }
  .field { display: grid; gap: var(--space-1); font-size: var(--font-size-small); font-weight: 500; }
  input, select {
    width: 100%;
    min-height: var(--size-control);
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-control);
    background: var(--color-surface-raised);
    color: var(--color-text);
  }
  .search-field { flex: 1 1 14rem; max-width: 24rem; }

  /* Flat blocks: stats, toolbars, cards, tables, notices, plans */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr));
    gap: var(--space-3);
    margin-block-end: var(--space-4);
  }
  .stat-card {
    display: grid;
    gap: var(--space-1);
    padding: var(--space-3) var(--space-4);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-surface);
    background: var(--color-surface-raised);
  }
  .stat-label { font-size: var(--font-size-caption); color: var(--color-text-muted); font-weight: 500; }
  .stat-value { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
  .stat-hint { font-size: var(--font-size-caption); color: var(--color-text-muted); }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    margin-block-end: var(--space-3);
  }

  .stack { display: grid; gap: var(--space-2); }
  .row-card, .panel-card, .auth-card {
    display: grid;
    gap: var(--space-3);
    padding: var(--space-4);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-surface);
    background: var(--color-surface-raised);
  }
  .auth-card { max-width: 28rem; }
  .auth-head { display: grid; gap: var(--space-2); justify-items: start; }
  .row-card {
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    padding: var(--space-3) var(--space-4);
  }
  .row-main { display: grid; gap: 2px; min-width: 0; }
  .member-cell { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
  .avatar { width: 36px; height: 36px; border-radius: var(--radius-pill); flex: none; }
  .row-title-line { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .row-meta { margin: 0; color: var(--color-text-muted); font-size: var(--font-size-small); }

  .table-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-surface);
    background: var(--color-surface-raised);
    overflow: hidden;
  }
  .table-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
  }
  .table-row + .table-row { border-block-start: 1px solid var(--color-border); }
  @container frame (max-width: 34rem) {
    .table-row { grid-template-columns: minmax(0, 1fr); justify-items: start; }
    .row-card { grid-template-columns: minmax(0, 1fr); }
  }

  .pill {
    display: inline-flex;
    align-items: center;
    padding: 2px 10px;
    border-radius: var(--radius-pill);
    background: var(--color-surface-sunken);
    color: var(--color-text-muted);
    font-size: var(--font-size-caption);
    font-weight: 600;
    white-space: nowrap;
  }
  .pill-accent { background: var(--color-accent-subtle); color: var(--color-accent); }

  .notice {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-surface);
    margin-block-end: var(--space-3);
  }
  .notice-copy { display: grid; gap: 2px; max-width: 54ch; }
  .notice-copy p { margin: 0; font-size: var(--font-size-small); }
  .notice-info { background: var(--color-accent-subtle); color: var(--color-text); border-color: var(--color-border); }
  .notice-success { background: var(--color-success-subtle); color: var(--color-success); border-color: var(--color-border); }
  .notice-warning { background: var(--color-warning-subtle); color: var(--color-warning); border-color: var(--color-border); }
  .notice-danger { background: var(--color-danger-subtle); color: var(--color-danger); border-color: var(--color-border); }

  .empty-state {
    display: grid;
    justify-items: start;
    gap: var(--space-3);
    padding: var(--space-5);
    border: 1px dashed var(--color-border-strong);
    border-radius: var(--radius-surface);
    background: var(--color-surface-raised);
    max-width: 38rem;
  }
  .empty-state p { margin: 0; color: var(--color-text-muted); max-width: 48ch; }
  .empty-icon {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-control);
    background: var(--color-accent-subtle);
    color: var(--color-accent);
    display: grid;
    place-items: center;
  }
  .empty-icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .facts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr));
    gap: var(--space-3);
    margin: 0;
    padding: var(--space-3);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-control);
    background: var(--color-surface);
  }
  .facts dt { font-size: var(--font-size-caption); color: var(--color-text-muted); font-weight: 600; }
  .facts dd { margin: 2px 0 0; font-weight: 500; }
  .danger-box {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-3);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-control);
    background: var(--color-danger-subtle);
    color: var(--color-danger);
  }
  .danger-box p { margin: 0; font-size: var(--font-size-small); }

  .plan-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr));
    gap: var(--space-3);
  }
  .plan-card {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    padding: var(--space-4);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-surface);
    background: var(--color-surface-raised);
  }
  .plan-featured { border-color: var(--color-accent); background: var(--color-surface-raised); }
  .plan-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
  .plan-price { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
  .plan-summary { margin: 0; color: var(--color-text-muted); font-size: var(--font-size-small); }
  .plan-list { margin: 0 0 auto; padding-inline-start: 1.15rem; display: grid; gap: var(--space-1); font-size: var(--font-size-small); color: var(--color-text-muted); }

  .skeleton {
    display: grid;
    gap: var(--space-2);
    padding: var(--space-4);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-surface);
    background: var(--color-surface-raised);
  }
  .skeleton span {
    display: block;
    height: 14px;
    border-radius: var(--radius-pill);
    background: linear-gradient(90deg, var(--color-surface-sunken) 40%, var(--color-border) 50%, var(--color-surface-sunken) 60%) 0 0 / 300% 100%;
    animation: shimmer var(--duration-shimmer) ease-in-out 3;
  }
  .skeleton span:first-child { width: 42%; height: 18px; }
  .skeleton span:nth-child(2) { width: 68%; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
</style>
</head>
