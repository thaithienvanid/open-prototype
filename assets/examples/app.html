<!doctype html>
<html lang="en" data-proto-format="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="platforms" content="web">
<meta name="themes" content="light dark">
<meta name="work-item" content="KIT-1">
<title>Baseplate — SaaS Starter Kit</title>
<style data-proto-tokens>
:root {
  --space-0_5: 2px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 16px;
  --space-4: 24px;
  --space-5: 32px;
  --radius-icon: 6px;
  --radius-control: 8px;
  --radius-surface: 12px;
  --radius-pill: 999px;
  --size-control: 44px;
  --size-sidebar: 244px;
  --size-content-max: 62rem;
  --font-sans: system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-size-caption: 0.8125rem;
  --font-size-small: 0.875rem;
  --font-size-body: 1rem;
  --font-size-heading: 1.1875rem;
  --font-size-title: 1.625rem;
  --duration-fast: 140ms;
  --duration-shimmer: 1400ms;
  --easing-standard: cubic-bezier(0.2, 0, 0, 1);
}
@media (prefers-reduced-motion: reduce) {
  :root {
    --duration-fast: 0ms;
    --duration-shimmer: 0ms;
  }
}
:root,
:root[data-proto-theme="light"] {
  --color-surface: #f7f8fa;
  --color-surface-raised: #ffffff;
  --color-surface-sunken: #eef1f5;
  --color-text: #181c23;
  --color-text-muted: #525b6b;
  --color-border: #dfe3ea;
  --color-border-strong: #8d99ac;
  --color-accent: #2558d4;
  --color-accent-strong: #1c45ab;
  --color-accent-subtle: #e8effd;
  --color-on-accent: #ffffff;
  --color-success: #0f6b47;
  --color-success-subtle: #e3f5ed;
  --color-warning: #8a4b00;
  --color-warning-subtle: #fef3db;
  --color-danger: #b82920;
  --color-danger-subtle: #fdeceb;
  --color-focus: #2558d4;
  color-scheme: light;
}
:root[data-proto-theme="dark"] {
  --color-surface: #101216;
  --color-surface-raised: #171a20;
  --color-surface-sunken: #20242c;
  --color-text: #e6e9ef;
  --color-text-muted: #a3adbd;
  --color-border: #282d37;
  --color-border-strong: #667085;
  --color-accent: #7ea6ff;
  --color-accent-strong: #a3c0ff;
  --color-accent-subtle: #182542;
  --color-on-accent: #0c1730;
  --color-success: #6ee7b7;
  --color-success-subtle: #122e24;
  --color-warning: #fcd34d;
  --color-warning-subtle: #2e240c;
  --color-danger: #fca5a5;
  --color-danger-subtle: #351817;
  --color-focus: #7ea6ff;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-proto-theme]) {
    --color-surface: #101216;
    --color-surface-raised: #171a20;
    --color-surface-sunken: #20242c;
    --color-text: #e6e9ef;
    --color-text-muted: #a3adbd;
    --color-border: #282d37;
    --color-border-strong: #667085;
    --color-accent: #7ea6ff;
    --color-accent-strong: #a3c0ff;
    --color-accent-subtle: #182542;
    --color-on-accent: #0c1730;
    --color-success: #6ee7b7;
    --color-success-subtle: #122e24;
    --color-warning: #fcd34d;
    --color-warning-subtle: #2e240c;
    --color-danger: #fca5a5;
    --color-danger-subtle: #351817;
    --color-focus: #7ea6ff;
    color-scheme: dark;
  }
}
</style>
<style>
  /* Mobile first: the styles outside every query are the 320 layout, one column in reading order. Each wider layout is
     added by a min-width query on a named container, each breakpoint written once: the frame's at 45rem, where the
     sidebar opens beside the screen, and the content's at 34rem, where a list's columns stand side by side. The grids of
     cards fit their own tracks. */
  * { box-sizing: border-box; }
  html { scroll-padding-block-end: calc(2 * var(--size-control) + 3 * var(--space-2) + var(--safe-area-inset-bottom, 0px)); }
  body {
    margin: 0;
    min-height: 100dvh;
    padding-block: var(--safe-area-inset-top, 0px) var(--safe-area-inset-bottom, 0px);
    font-family: var(--font-sans);
    font-size: var(--font-size-body);
    line-height: 1.55;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
    background: var(--color-surface);
    color: var(--color-text);
    container: frame / inline-size;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  button, input, select { font: inherit; color: inherit; }
  /* A paragraph's line holds at most about 75 characters. */
  p { max-width: 60ch; }
  .mono { font-family: var(--font-mono); font-size: var(--font-size-caption); color: var(--color-text-muted); }
  .muted { color: var(--color-text-muted); margin: 0; }

  /* Flat SaaS shell. At 320 the workspace menu folds behind one control beside the brand, so the screen's title and its
     main action stand in the first screenful; from 45rem the same menu stands open as the sidebar. */
  .shell {
    display: grid;
    min-height: 100dvh;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto 1fr;
    grid-template-areas: "side" "top" "main";
  }
  .sidebar {
    grid-area: side;
    display: grid;
    align-content: start;
    gap: var(--space-3);
    padding: var(--space-2) var(--space-3);
    background: var(--color-surface-raised);
    border-block-end: 1px solid var(--color-border);
  }
  .brand-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
  }
  .brand-mark {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    font-weight: 700;
    letter-spacing: -0.015em;
  }
  .brand-icon {
    width: 1.5rem;
    height: 1.5rem;
    border-radius: var(--radius-icon);
    background: var(--color-accent);
    color: var(--color-on-accent);
    display: grid;
    place-items: center;
    font-size: var(--font-size-caption);
    font-weight: 700;
  }
  .menu-btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    min-width: var(--size-control);
    min-height: var(--size-control);
    padding: 0 var(--space-3);
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-control);
    background: var(--color-surface-raised);
    color: var(--color-text);
    font-size: var(--font-size-small);
    font-weight: 600;
    cursor: pointer;
  }
  .menu-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .menu-btn:hover { background: var(--color-surface-sunken); }
  .menu-btn[aria-expanded="true"] { background: var(--color-accent-subtle); border-color: var(--color-accent); color: var(--color-accent); }
  .side-panel {
    display: grid;
    gap: var(--space-3);
    padding-block-end: var(--space-2);
  }
  .org-box {
    display: flex;
    flex-direction: column;
    gap: var(--space-0_5);
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-control);
    background: var(--color-surface);
    font-size: var(--font-size-small);
  }
  .org-box strong { font-weight: 600; }
  .org-box span { color: var(--color-text-muted); font-size: var(--font-size-caption); }

  .side-nav {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }
  .side-nav button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    min-height: var(--size-control);
    padding: var(--space-2) var(--space-3);
    border: 1px solid transparent;
    border-radius: var(--radius-control);
    background: transparent;
    color: var(--color-text-muted);
    font-weight: 500;
    text-align: start;
    cursor: pointer;
    transition: background-color var(--duration-fast) var(--easing-standard), color var(--duration-fast) var(--easing-standard);
  }
  .side-nav button:hover {
    background: var(--color-surface-sunken);
    color: var(--color-text);
  }
  .side-nav button[aria-current="page"] {
    background: var(--color-accent-subtle);
    color: var(--color-accent);
    font-weight: 600;
  }
  /* The tool marks the link to a screen the shown one stands under as its section: the section you are inside, not
     the page you are on, so it takes the accent's text and no fill. */
  .side-nav button[data-proto-section] {
    color: var(--color-accent);
    font-weight: 600;
  }
  .nav-divider {
    margin: var(--space-2) 0;
    border: 0;
    border-top: 1px solid var(--color-border);
  }

  /* The top bar. The back control, on a child screen, has a row of its own above the title; where it is hidden the
     row takes no room, so a top-level screen shows no empty band. The title keeps its start edge on every screen. */
  .topbar {
    grid-area: top;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    justify-items: start;
    row-gap: var(--space-2);
    padding: var(--space-3);
    background: var(--color-surface-raised);
    border-block-end: 1px solid var(--color-border);
  }
  .topbar h1 {
    margin: 0;
    font-size: var(--font-size-title);
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    min-width: var(--size-control);
    min-height: var(--size-control);
    padding: var(--space-1) var(--space-3);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-control);
    background: var(--color-surface);
    color: var(--color-text);
    font-size: var(--font-size-small);
    font-weight: 500;
    cursor: pointer;
  }
  .back-btn:hover { background: var(--color-surface-sunken); }

  main {
    grid-area: main;
    width: 100%;
    max-width: var(--size-content-max);
    padding: var(--space-3);
    container: content / inline-size;
  }
  main:focus, [data-proto-slot="title"]:focus { outline: none; }
  h2 { margin: 0; font-size: var(--font-size-heading); font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
  .section-heading { margin: var(--space-5) 0 var(--space-3); }

  /* Controls */
  .actions { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    min-height: var(--size-control);
    padding: 0 var(--space-3);
    border-radius: var(--radius-control);
    font-weight: 600;
    font-size: var(--font-size-small);
    cursor: pointer;
    transition: background-color var(--duration-fast) var(--easing-standard), border-color var(--duration-fast) var(--easing-standard);
  }
  .btn-full { width: 100%; }
  .btn-primary { border: 1px solid var(--color-accent); background: var(--color-accent); color: var(--color-on-accent); }
  .btn-primary:hover { background: var(--color-accent-strong); border-color: var(--color-accent-strong); }
  .btn-secondary { border: 1px solid var(--color-border-strong); background: var(--color-surface-raised); color: var(--color-text); }
  .btn-secondary:hover { background: var(--color-surface-sunken); }
  .btn-danger { border: 1px solid var(--color-danger); background: var(--color-danger); color: var(--color-on-accent); }

  /* Forms: one column, each label above its field, the field's text at the body size so a phone does not zoom. */
  .field-group { display: grid; gap: var(--space-3); }
  .field { display: grid; gap: var(--space-1); font-size: var(--font-size-small); font-weight: 500; }
  input, select {
    width: 100%;
    min-height: var(--size-control);
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-control);
    background: var(--color-surface-raised);
    color: var(--color-text);
    font-size: var(--font-size-body);
    font-weight: 400;
  }
  .search-field { flex: 1 1 14rem; max-width: 24rem; }
  /* A form's action stays within a thumb's reach: while the form is taller than the screen, it sticks to the screen's
     foot, above the system bar. The root's scroll padding keeps a focused field clear of it. */
  .field-group ~ .actions {
    position: sticky;
    bottom: var(--safe-area-inset-bottom, 0px);
    padding-block: var(--space-2);
    background: var(--color-surface-raised);
  }

  /* Flat blocks: stats, toolbars, cards, tables, notices, plans */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr));
    gap: var(--space-3);
    margin-block-end: var(--space-4);
  }
  .stat-card {
    display: grid;
    grid-row: span 3;
    grid-template-rows: subgrid;
    row-gap: var(--space-1);
    padding: var(--space-3) var(--space-4);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-surface);
    background: var(--color-surface-raised);
  }
  .stat-label { font-size: var(--font-size-caption); color: var(--color-text-muted); font-weight: 500; }
  .stat-value { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
  .stat-hint { font-size: var(--font-size-caption); color: var(--color-text-muted); }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    margin-block-end: var(--space-3);
  }
  /* The view's main action stands where the header row ends, on the row's line or on its own. */
  .toolbar > :last-child:not(:first-child) { margin-inline-start: auto; }
  .panel-card > .toolbar { margin-block-end: 0; }

  .stack { display: grid; gap: var(--space-3); }
  .row-card, .panel-card, .auth-card {
    display: grid;
    gap: var(--space-3);
    padding: var(--space-4);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-surface);
    background: var(--color-surface-raised);
  }
  .auth-card { max-width: 28rem; }
  .auth-head { display: grid; gap: var(--space-2); justify-items: start; }
  /* A list's columns belong to the list: each row takes them as a subgrid, so a longer value in one row moves nothing in
     another. Text shares its first baseline across a row; a row's actions stand at its end. In a narrow content area a
     list has one track, and the stacked parts of a row share one start edge. */
  .row-list {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: var(--space-3);
  }
  .row-card {
    grid-column: 1 / -1;
    grid-template-columns: subgrid;
    align-items: baseline;
    justify-items: start;
    padding: var(--space-3) var(--space-4);
  }
  .row-summary { display: contents; }
  .row-main { display: grid; gap: var(--space-0_5); min-width: 0; }
  /* The name's baseline is the row's, so the role and the date beside it share it; the avatar stands centred on the
     name and the email together, as the row's picture. */
  .member-cell { display: flex; align-items: baseline; gap: var(--space-3); min-width: 0; }
  .avatar { width: 36px; height: 36px; border-radius: var(--radius-pill); flex: none; align-self: center; }
  .row-title-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2); }
  .row-meta { margin: 0; color: var(--color-text-muted); font-size: var(--font-size-small); }

  .table-list {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    list-style: none;
    margin: 0;
    padding: 0;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-surface);
    background: var(--color-surface-raised);
    overflow: hidden;
  }
  .table-row {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: subgrid;
    align-items: baseline;
    justify-items: start;
    gap: var(--space-2) var(--space-3);
    padding: var(--space-3) var(--space-4);
  }
  .table-row + .table-row { border-block-start: 1px solid var(--color-border); }

  .pill {
    display: inline-flex;
    align-items: center;
    padding: var(--space-0_5) var(--space-2);
    border-radius: var(--radius-pill);
    background: var(--color-surface-sunken);
    color: var(--color-text-muted);
    font-size: var(--font-size-caption);
    font-weight: 600;
    justify-self: start;
  }
  .pill-accent { background: var(--color-accent-subtle); color: var(--color-accent); }

  .notice {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-surface);
    margin-block-end: var(--space-3);
  }
  .notice-copy { display: grid; gap: var(--space-0_5); max-width: 54ch; }
  .notice-copy p { margin: 0; }
  .notice-info { background: var(--color-accent-subtle); color: var(--color-text); }
  .notice-success { background: var(--color-success-subtle); color: var(--color-success); }
  .notice-warning { background: var(--color-warning-subtle); color: var(--color-warning); }
  .notice-danger { background: var(--color-danger-subtle); color: var(--color-danger); }

  .empty-state {
    display: grid;
    justify-items: start;
    gap: var(--space-3);
    padding: var(--space-4);
    border: 1px dashed var(--color-border-strong);
    border-radius: var(--radius-surface);
    background: var(--color-surface-raised);
    max-width: 38rem;
  }
  .empty-state p { margin: 0; color: var(--color-text-muted); max-width: 48ch; }
  .empty-icon {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-control);
    background: var(--color-accent-subtle);
    color: var(--color-accent);
    display: grid;
    place-items: center;
  }
  .empty-icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .facts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr));
    gap: var(--space-3);
    margin: 0;
    padding: var(--space-3);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-control);
    background: var(--color-surface);
  }
  .facts dt { font-size: var(--font-size-caption); color: var(--color-text-muted); font-weight: 600; }
  .facts dd { margin: var(--space-0_5) 0 0; font-weight: 500; }
  .btn[aria-disabled="true"] { color: var(--color-text-muted); cursor: default; }
  .danger-zone { display: grid; gap: var(--space-3); margin-block-start: var(--space-4); }
  .danger-box {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-3);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-control);
    background: var(--color-danger-subtle);
    color: var(--color-danger);
  }
  .danger-box p { margin: 0; }

  .plan-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr));
    gap: var(--space-3);
  }
  .plan-card {
    display: grid;
    grid-row: span 5;
    grid-template-rows: subgrid;
    gap: var(--space-3);
    padding: var(--space-4);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-surface);
    background: var(--color-surface-raised);
  }
  .plan-featured { border-color: var(--color-accent); }
  .plan-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2); }
  .plan-price { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
  .plan-summary { margin: 0; color: var(--color-text-muted); }
  .plan-list { margin: 0; padding-inline-start: var(--space-3); display: grid; gap: var(--space-1); color: var(--color-text-muted); }

  .skeleton {
    display: grid;
    gap: var(--space-2);
    padding: var(--space-4);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-surface);
    background: var(--color-surface-raised);
  }
  .skeleton span {
    display: block;
    height: 14px;
    border-radius: var(--radius-pill);
    background: linear-gradient(90deg, var(--color-surface-sunken) 40%, var(--color-border) 50%, var(--color-surface-sunken) 60%) 0 0 / 300% 100%;
    animation: shimmer var(--duration-shimmer) ease-in-out 3;
  }
  .skeleton span:first-child { width: 42%; height: 18px; }
  .skeleton span:nth-child(2) { width: 68%; }
  /* A loading state has the shape of what it loads: the toolbar's height, the stat cards, and the rows. */
  .skeleton-stat { padding: var(--space-3) var(--space-4); }
  .skeleton-stat span:nth-child(2) { width: 24%; height: 28px; }
  .skeleton-stat span:nth-child(3) { width: 56%; }
  .skeleton-bar { min-height: var(--size-control); margin-block-end: var(--space-3); }
  .skeleton-row { padding: var(--space-3) var(--space-4); }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }

  /* From 45rem of frame, room for the sidebar and a screen of 30rem beside it: the sidebar stands open beside the
     screen, its menu control goes, and a form's action stays where the form ends. The menu's panel is the same element,
     shown here whatever its hidden says, so the links are written once. */
  @container frame (min-width: 45rem) {
    .shell {
      grid-template-columns: var(--size-sidebar) minmax(0, 1fr);
      grid-template-rows: auto 1fr;
      grid-template-areas: "side top" "side main";
    }
    .sidebar {
      gap: var(--space-4);
      padding: var(--space-4) var(--space-3);
      border-block-end: 0;
      border-inline-end: 1px solid var(--color-border);
    }
    .brand-row { padding-inline: var(--space-2); }
    .menu-btn { display: none; }
    .side-panel, .side-panel[hidden] { display: grid !important; gap: var(--space-4); padding-block-end: 0; }
    .topbar { padding: var(--space-3) var(--space-5); }
    main { padding: var(--space-5); }
    .field-group ~ .actions { position: static; padding-block: 0; }
  }
  /* From 34rem of content: a list's three columns stand side by side, and its last column, a time or the row's action,
     stands at the row's end. */
  @container content (min-width: 34rem) {
    .table-list, .row-list { grid-template-columns: minmax(0, 1fr) auto auto; }
    .table-row, .row-card { justify-items: normal; }
    .table-row > :last-child, .row-actions { justify-self: end; }
  }
</style>
