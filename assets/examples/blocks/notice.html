<div class="notice notice-{{tone}}" role="{{role}}" data-proto-component="notice" data-proto-variant="{{tone}}">
  <div class="notice-copy">
    <strong data-proto-text="{{title-key}}"></strong>
    <p data-proto-text="{{body-key}}"></p>
  </div>
  <button type="button" class="btn btn-secondary" data-proto-component="button" data-proto-variant="secondary" data-proto-go="{{go}}" data-testid="{{testid}}">{{action}}</button>
</div>
