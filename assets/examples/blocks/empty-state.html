<div class="empty-state" data-proto-component="empty-state">
  <div class="empty-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" focusable="false"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18M9 15h6"/></svg>
  </div>
  <h2 data-proto-text="{{title-key}}"></h2>
  <p data-proto-text="{{body-key}}"></p>
  <div class="actions">
    <button type="button" class="btn btn-primary" data-proto-component="button" data-proto-variant="primary" data-proto-go="{{go}}" data-testid="{{testid}}">{{action}}</button>
  </div>
</div>
