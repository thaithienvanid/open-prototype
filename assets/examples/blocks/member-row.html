<li class="table-row" data-proto-component="member-row">
  <div class="member-cell">
    <img class="avatar" data-proto-image="avatar" alt="">
    <div class="row-main">
      <strong data-proto-field="name"></strong>
      <span class="row-meta" data-proto-field="email"></span>
    </div>
  </div>
  <span class="pill" data-proto-component="role-badge" data-proto-field="role"></span>
  <span class="row-meta" data-proto-field="joined"></span>
</li>
