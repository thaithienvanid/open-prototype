<article class="row-card" data-proto-component="project-row">
  <div class="row-main">
    <div class="row-title-line">
      <h2 data-proto-field="name"></h2>
      <span class="pill" data-proto-component="status-pill" data-proto-field="status"></span>
    </div>
    <p class="row-meta" data-proto-field="meta"></p>
  </div>
  <div class="row-actions">
    <button type="button" class="btn btn-secondary btn-sm" data-proto-component="button" data-proto-variant="secondary" data-proto-go="projects:detail" data-testid="project-open">Open</button>
  </div>
</article>
