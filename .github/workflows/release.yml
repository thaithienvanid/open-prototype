# Run the check on the commit, then build the five binaries, each on a machine of its own system, run each there, and,
# on a pushed tag `v*` whose commit is on main, attach them with SHA256SUMS to a GitHub release: made as a draft, the
# files uploaded to it, then published. Nothing is built before the check passes on the tag's commit, so no release
# holds a commit the check has not passed on. A run started by hand from the Actions tab is a trial: it runs the check,
# builds and runs the binaries, keeps each as an artifact of the run, and publishes nothing. Each action is pinned by its
# full commit SHA, with its release in the comment beside it.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # `bun run check` on macOS, Linux and Windows, as on every push to main, here on the commit the run was started for.
  check:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  # Each binary is built and run on a machine of its own system: it prints the package's version, starts a design and
  # checks it, writes and builds the example, starts a design document, and prints the reference. The macOS x64 file is
  # built for Intel and runs under Rosetta 2 on GitHub's Apple silicon runner.
  binary:
    needs: check
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64, file: open-prototype-darwin-arm64 }
          - { os: macos-latest, target: darwin-x64, file: open-prototype-darwin-x64 }
          - { os: ubuntu-latest, target: linux-x64, file: open-prototype-linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64, file: open-prototype-linux-arm64 }
          # Windows runs a program by its .exe ending, so the Windows file carries it.
          - { os: windows-latest, target: windows-x64, file: open-prototype-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Build the binary
        env:
          TARGET: ${{ matrix.target }}
          FILE: ${{ matrix.file }}
        run: bun build --compile --target="bun-$TARGET" src/cli.ts --outfile "dist/$FILE"
      # Each command that reads a file the binary carries runs from a folder outside the clone, so a shipped file that
      # `src/assets.ts` does not embed fails here, as it would for a person.
      - name: Print the version, start a design and check it, write and build the example, start a design document, and print the reference
        env:
          FILE: ${{ matrix.file }}
        run: |
          version="$(jq -r .version package.json)"
          binary="$PWD/dist/$FILE"
          reference="$PWD/docs/reference.md"
          printed="$("$binary" --version | tr -d '\r')"
          test "$printed" = "$version" || { echo "$FILE printed $printed, not the package's $version" >&2; exit 1; }
          trial="$(mktemp -d)"
          cd "$trial"
          "$binary" new-design design/first.html
          "$binary" check design/first.html
          "$binary" example
          "$binary" build .prototype/example/app.html
          "$binary" new-design-md
          "$binary" guide --reference | tr -d '\r' > reference.md
          cmp reference.md "$reference" || { echo "$FILE printed a reference that differs from docs/reference.md" >&2; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.file }}
          path: dist/${{ matrix.file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # The attestation: an OIDC token to sign it through Sigstore, and the rights to store it and to link it to the files.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # The whole history, so the step below can tell that the tag's commit is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: open-prototype-*
          path: dist
          merge-multiple: true
      - name: Check that the tag names the package's version, on a commit of main
        run: |
          version="$(jq -r .version package.json)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "the tag $GITHUB_REF_NAME names no version $version: tag the commit as v$version" >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "the tag $GITHUB_REF_NAME names a commit that is not on main: tag a commit of main" >&2; exit 1; }
      - name: Write the sums and the release text
        run: |
          set -- dist/open-prototype-*
          test "$#" -eq 5 || { echo "the release needs the five binaries; the run made $#: run the workflow again" >&2; exit 1; }
          (cd dist && sha256sum open-prototype-* > SHA256SUMS && cat SHA256SUMS)
          # The version's section of the CHANGELOG, without its own heading, which the release's title already says.
          awk -v version="${GITHUB_REF_NAME#v}" '/^## / { keep = ($2 == version); next } keep' CHANGELOG.md > release-text.md
          test -s release-text.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}: name the Unreleased section by the version" >&2; exit 1; }
      # A signed SLSA build provenance for each binary and for SHA256SUMS: this workflow built it from this commit. A
      # person checks a file with `gh attestation verify <file> --repo <this repository>`.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/open-prototype-*
            dist/SHA256SUMS
      # A draft first, so no one sees a release that lacks a file: the files go up to the draft, and only then is it
      # published. A run that stops between leaves a draft, which only the repository's writers see.
      - name: Make the release as a draft, upload its files, and publish it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-text.md
          gh release upload "$GITHUB_REF_NAME" dist/open-prototype-* dist/SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false
